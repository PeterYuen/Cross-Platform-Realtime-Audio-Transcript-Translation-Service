[package]
name = "realtime-translator"
version = "0.1.0"
edition = "2021"

[dependencies]
kalosm = { version = "0.4", features = ["language", "llama", "sound"] }
cpal = "0.15"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
parking_lot = "0.12"
dirs-next = "2"
futures-util = "0.3"
rodio = "0.20"
hound = "3"

[profile.dev]
debug = "line-tables-only"

# ML dependencies (ort/onnxruntime, candle, tokenizers) are unusably slow at opt-level 0.
# Optimize them even in dev builds; our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 1
